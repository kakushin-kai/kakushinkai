<form
  name="contact"
  method="POST"
  data-netlify="true"
  netlify-honeypot="bot-field"
>

  <input type="hidden" name="form-name" value="contact">

  <p hidden>
    <input name="bot-field">
  </p>

  <input
    type="text"
    name="nom"
    placeholder="Votre nom"
    required
  >

  <input
    type="email"
    name="email"
    placeholder="Votre email"
    required
  >

  <textarea
    name="message"
    placeholder="Votre message"
    required
  ></textarea>

  <button type="submit">
    Envoyer
  </button>

</form>
